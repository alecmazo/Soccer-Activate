name: Deploy Soccer-Activate to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Publishes the static SPA to the gh-pages branch (legacy Pages source).
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build static SPA
        run: npm run build:spa

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist-spa
          force_orphan: true
          enable_jekyll: false
